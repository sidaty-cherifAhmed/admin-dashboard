<mat-card class="page" dir="rtl">
  <div class="page-header">
    <div>
      <h2>إدارة التصنيفات</h2>
      <p>إضافة وتعديل وحذف والبحث داخل جميع التصنيفات.</p>
    </div>

    <div class="header-actions">

      <mat-form-field appearance="outline" class="search">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [formControl]="filterForm.controls.search" placeholder="ابحث باسم التصنيف" />
      </mat-form-field>

      <button mat-flat-button color="primary" type="button" (click)="openCreateCategory()">
        <mat-icon>add</mat-icon>
        تصنيف جديد
      </button>

    </div>
  </div>

  <mat-card class="editor" *ngIf="showForm">
    <div class="editor-title">{{ isEditMode ? 'تعديل التصنيف' : 'إضافة تصنيف جديد' }}</div>

    <form [formGroup]="categoryForm" (ngSubmit)="submitCategory()">

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>اسم التصنيف</mat-label>
          <input matInput formControlName="categoryName" />
          <mat-error *ngIf="categoryForm.controls.categoryName.hasError('required')">اسم التصنيف مطلوب</mat-error>
          <mat-error *ngIf="categoryForm.controls.categoryName.hasError('minlength')">حرفان على الأقل</mat-error>
        </mat-form-field>
      </div>

      <div class="buttons">
        <button mat-button type="button" (click)="closeForm()">إلغاء</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="submitting" >
          {{ submitting ? 'جاري الحفظ...' : (isEditMode ? 'حفظ التعديل' : 'إنشاء التصنيف') }}
        </button>
      </div>

    </form>

  </mat-card>

  <div class="table-wrap mat-elevation-z2" *ngIf="!loading; else loadingBlock">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="categoryName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>اسم التصنيف</th>
        <td mat-cell *matCellDef="let category">
          <span class="category-badge">{{ category.categoryName }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>إجراءات</th>
        <td mat-cell *matCellDef="let category" class="actions-cell">
          <button mat-icon-button color="primary" matTooltip="تعديل" type="button" (click)="openEditCategory(category)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="حذف" type="button" (click)="deleteCategory(category.categoryId)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="empty" *ngIf="dataSource.data.length === 0">
        <td [attr.colspan]="displayedColumns.length">لا توجد تصنيفات حالياً</td>
      </tr>

    </table>
    
  </div>

  <ng-template #loadingBlock>
    <div class="loading">جاري تحميل التصنيفات...</div>
  </ng-template>

  <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" [pageSize]="10" showFirstLastButtons></mat-paginator>
</mat-card>
