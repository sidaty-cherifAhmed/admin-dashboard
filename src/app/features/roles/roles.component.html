<mat-card class="page" dir="rtl">
  <div class="page-header">
    <div>
      <h2>إدارة الأدوار</h2>
      <p>إنشاء الأدوار وتحديثها وربطها بالمستخدمين.</p>
    </div>

    <div class="header-actions">
      <mat-form-field appearance="outline" class="search">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [formControl]="filterForm.controls.search" placeholder="بحث باسم الدور أو الوصف" />
      </mat-form-field>

      <button mat-flat-button color="primary" type="button" (click)="openCreateRole()">
        <mat-icon>add</mat-icon>
        دور جديد
      </button>
    </div>
  </div>

  <mat-card class="editor" *ngIf="showForm">
    <div class="editor-title">{{ isEditMode ? 'تعديل الدور' : 'إضافة دور جديد' }}</div>

    <form [formGroup]="roleForm" (ngSubmit)="submitRole()">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>اسم الدور</mat-label>
          <input matInput formControlName="roleName" />
          <mat-error *ngIf="roleForm.controls.roleName.hasError('required')">اسم الدور مطلوب</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>الوصف</mat-label>
          <input matInput formControlName="description" />
          <mat-error *ngIf="roleForm.controls.description.hasError('required')">الوصف مطلوب</mat-error>
        </mat-form-field>
      </div>

      <div class="buttons">
        <button mat-button type="button" (click)="closeForm()">إلغاء</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'جاري الحفظ...' : (isEditMode ? 'حفظ التعديل' : 'إنشاء الدور') }}
        </button>
      </div>
    </form>
  </mat-card>

  <div class="table-wrap mat-elevation-z2" *ngIf="!loading; else loadingBlock">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="roleName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>اسم الدور</th>
        <td mat-cell *matCellDef="let role">
          <span class="role-badge">{{ role.roleName }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>الوصف</th>
        <td mat-cell *matCellDef="let role">{{ role.description || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>إجراءات</th>
        <td mat-cell *matCellDef="let role" class="actions-cell">
          <button mat-icon-button color="primary" matTooltip="تعديل" type="button" (click)="openEditRole(role)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="حذف" type="button" (click)="deleteRole(role.roleId)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="empty" *ngIf="dataSource.data.length === 0">
        <td [attr.colspan]="displayedColumns.length">لا توجد أدوار حالياً</td>
      </tr>
    </table>
  </div>

  <ng-template #loadingBlock>
    <div class="loading">جاري تحميل بيانات الأدوار...</div>
  </ng-template>

  <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" [pageSize]="10" showFirstLastButtons></mat-paginator>
</mat-card>
